<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="signup-card">
      <div class="brand">
        <span class="brand-mark">S</span>
        <div>
          <h1>Create account</h1>
          <p>Sign up to access your dashboard.</p>
        </div>
      </div>

      <form id="signupForm" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 placeholder="e.g. NWCC">
          <small class="error" id="usernameError"></small>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 placeholder="kk****@srmist.edu.in / example@xyz.com">
          <small class="error" id="emailError"></small>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password"
                 autocomplete="new-password" placeholder="At least 6 characters">
          <small class="error" id="passwordError"></small>
        </div>

        <button class="primary-btn" type="submit">Create account <span>→</span></button>
        <p class="form-status" id="formStatus" aria-live="polite"></p>
      </form>
    </section>

    <section class="dashboard-card">
      <div class="dashboard-header">
        <div>
          <p class="eyebrow">Dashboard</p>
          <h2>Registered users</h2>
          <p class="muted">Accounts currently stored in this browser.</p>
        </div>
        <div class="user-count" id="userCount">0 users</div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Username</th>
              <th>Email</th>
              <th>Password</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>

        <div class="empty-state" id="emptyState">
          <div class="empty-icon">+</div>
          <h3>No users yet</h3>
          <p>Create an account above and it will appear here.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
